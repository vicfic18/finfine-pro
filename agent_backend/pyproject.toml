[project]
name = "finfine-agent-backend"
version = "0.1.0"
description = "Local Strands agent and financial tools for FinFine Pro"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.34,<2",
  "botocore[crt]>=1.34,<2",
  "fastapi>=0.115,<1",
  "PyJWT[crypto]>=2.9,<3",
  "python-dotenv>=1,<2",
  "strands-agents[gemini,openai]>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
