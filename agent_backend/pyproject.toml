[project]
name = "finfine-agent-backend"
version = "0.1.0"
description = "Read-only financial tools for the FinFine Pro agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.34,<2",
  "botocore[crt]>=1.34,<2",
  "strands-agents>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
