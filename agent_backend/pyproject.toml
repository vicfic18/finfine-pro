[project]
name = "finfine-agent-backend"
version = "0.1.0"
description = "Local Strands agent and financial tools for FinFine Pro"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bedrock-agentcore>=1,<2",
  "boto3>=1.34,<2",
  "botocore[crt]>=1.34,<2",
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "strands-agents[openai]>=1,<2",
  "strands-agents-tools>=0.2,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20:bedrock_agentcore.runtime.context",
]
