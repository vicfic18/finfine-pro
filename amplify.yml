version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    build:
      commands:
        - env | grep -E '^(FINFINE|COGNITO|DOCUMENT|TRANSACTION|OBLIGATION|PRODUCT|PURCHASE|SALE|CASH|SUPPLIER|MERCHANT|RECURRING|EXPECTED|INVENTORY|STATUTORY|S3|MODEL|GROQ|CODE|AWS_REGION)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
